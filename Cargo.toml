[workspace]
resolver = "2"
members = [
    "crates/qenc-core",
    "crates/qenc-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qenc/qenc"

[workspace.dependencies]
# Core crypto
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = { version = "0.10" }
x25519-dalek = { version = "2" }
curve25519-dalek = { version = "4", features = ["zeroize"] }
hmac = { version = "0.12" }
sha2 = { version = "0.10" }
rand = { version = "0.8", features = ["getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["std"] }
zeroize = { version = "1.8", features = ["derive"] }


# Post-Quantum: fips203 (ML-KEM-1024) - pure Rust, uses rand_core 0.6
fips203 = { version = "0.5" }

# Compression
zstd = { version = "0.13", features = ["zstdmt"] }

# Archive
tar = "0.4"
walkdir = "2"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
indicatif = { version = "0.17", features = ["rayon"] }
rayon = "1.10"
humantime = "2.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
hex = "0.4"
tempfile = "3"
thiserror = "1.0"

# Async (for future GUI integration)
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints]
rust = { unsafe_code = "forbid", unused_variables = "warn", unused_imports = "warn" }
clippy = { all = { level = "warn", priority = -1 }, pedantic = { level = "warn", priority = -1 }, nursery = { level = "warn", priority = -1 }, cargo = { level = "warn", priority = -1 }, multiple_crate_versions = "allow" }

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true