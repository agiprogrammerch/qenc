name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag to build/publish (e.g. v1.0.0). Leave blank for a test run without publishing.'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_BUILD_JOBS: '2'
  NODE_OPTIONS: '--max-old-space-size=1536'

jobs:
  build-linux:
    name: Build Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG"             >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION (tag $TAG)"

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/qenc-core
            crates/qenc-cli
            src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Tests
        run: cargo test --workspace

      - name: Build Tauri .deb
        run: npm run tauri build -- --bundles deb

      - name: Build headless CLI
        run: cargo build --release -p qenc-cli

      - name: Collect Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.VERSION }}"
          mkdir -p release-assets
          DEB=$(ls target/release/bundle/deb/*.deb 2>/dev/null || ls src-tauri/target/release/bundle/deb/*.deb)
          cp "$DEB" "release-assets/qenc-${VERSION}-linux-amd64.deb"
          # Headless CLI archive
          CLI=$(ls target/release/qenc 2>/dev/null || ls src-tauri/target/release/qenc)
          mkdir -p cli-pkg && cp "$CLI" cli-pkg/qenc
          (cd cli-pkg && tar -czf "../release-assets/qenc-cli-${VERSION}-linux-amd64.tar.gz" qenc)
          ls -lh release-assets

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-assets
          path: release-assets/*

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/qenc-core
            crates/qenc-cli
            src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Tests
        run: cargo test --workspace

      - name: Relax Windows Defender for the build (never fails)
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:LOCALAPPDATA\tauri", "$env:TEMP"
            Write-Host "Added Windows Defender exclusions for workspace and Tauri NSIS cache."
          } catch {
            Write-Warning "Could not add Defender exclusions: $_"
          }

      - name: Build Tauri NSIS installer
        run: npm run tauri build -- --bundles nsis --no-binary-patching --verbose

      - name: Build headless CLI
        run: cargo build --release -p qenc-cli

      - name: Collect Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.VERSION }}"
          mkdir -p release-assets cli-pkg
          SETUP=$(ls target/release/bundle/nsis/*-setup.exe 2>/dev/null || ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          cp "$SETUP" "release-assets/qenc-${VERSION}-windows-x64-setup.exe"
          CLI=$(ls target/release/qenc.exe 2>/dev/null || ls src-tauri/target/release/qenc.exe)
          cp "$CLI" cli-pkg/qenc.exe
          ls -lh release-assets

      - name: Package headless CLI (zip)
        shell: pwsh
        run: |
          $version = "${{ steps.vars.outputs.VERSION }}"
          $dest = "release-assets\qenc-cli-$version-windows-x64.zip"
          if (Test-Path $dest) { Remove-Item -Force $dest }
          Compress-Archive -Path cli-pkg\qenc.exe -DestinationPath $dest -Force
          Get-ChildItem release-assets | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-assets
          path: release-assets/*

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [ "${GITHUB_REF#refs/tags/}" != "${GITHUB_REF}" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust stable (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/qenc-core
            crates/qenc-cli
            src-tauri

      - name: Set up Android SDK (API 36 + NDK) from the runner's pre-installed SDK
        shell: bash
        run: |
          set -euo pipefail
          # The ubuntu-latest image ships the Android SDK at /usr/local/lib/android/sdk
          # with cmdline-tools already installed — use it directly (android-actions/
          # setup-android@v3 crashes on the deprecated `sdkmanager tools` command).
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER (SDK_ROOT=$SDK_ROOT)"
            exit 1
          fi

          # Accept licenses: `yes` gets SIGPIPE'd once sdkmanager stops reading,
          # which under `set -o pipefail` surfaces as exit 141. Disable pipefail
          # around the pipe so a benign early-close never fails the step.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

          NDK_PATH="$SDK_ROOT/ndk/27.2.12479018"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "NDK_HOME=$NDK_PATH"
            echo "ANDROID_NDK_HOME=$NDK_PATH"
          } >> "$GITHUB_ENV"
          {
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_PATH"
          echo "Android SDK ready at $SDK_ROOT (NDK $NDK_PATH)"

      - name: Verify Android SDK exports
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "NDK_HOME=$NDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$NDK_HOME"
          sdkmanager --version

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: tauri android init + patch Gradle/Manifest
        run: |
          npx tauri android init --ci
          node scripts/patch-android-project.mjs

      - name: Generate app launcher icons for all Android densities
        run: npx tauri icon src-tauri/icons/icon.svg

      - name: Configure release signing (optional)
        env:
          QENC_KEYSTORE_BASE64: ${{ secrets.QENC_KEYSTORE_BASE64 }}
          QENC_KEYSTORE_PASSWORD: ${{ secrets.QENC_KEYSTORE_PASSWORD }}
          QENC_KEY_ALIAS: ${{ secrets.QENC_KEY_ALIAS }}
          QENC_KEY_PASSWORD: ${{ secrets.QENC_KEY_PASSWORD }}
        run: |
          if [ -z "$QENC_KEYSTORE_BASE64" ]; then
            echo "::warning::QENC_KEYSTORE_BASE64 is not set — building an UNSIGNED APK (test run)."
          else
            echo "$QENC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/qenc-release.keystore"
            echo "QENC_KEYSTORE_PATH=$RUNNER_TEMP/qenc-release.keystore"  >> "$GITHUB_ENV"
            echo "QENC_KEYSTORE_PASSWORD=$QENC_KEYSTORE_PASSWORD"       >> "$GITHUB_ENV"
            echo "QENC_KEY_ALIAS=$QENC_KEY_ALIAS"                      >> "$GITHUB_ENV"
            echo "QENC_KEY_PASSWORD=$QENC_KEY_PASSWORD"                >> "$GITHUB_ENV"
          fi

      - name: Build universal APK (Android 7 -> 16, arm64 + armv7)
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Collect Android artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.VERSION }}"
          mkdir -p release-assets

          echo "All APKs produced under src-tauri/gen/android/app/build/outputs/apk:"
          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" -print | sort | sed 's/^/    /'

          # Gradle's universal APK is `app-universal-release.apk`; exclude any
          # `*-unsigned.apk` so a debug/unsigned artifact can never be mistaken
          # for the signed release build.
          SIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -type f \
            -name "*universal-release.apk" ! -name "*-unsigned.apk" | sort | head -n1 || true)

          if [ -n "$SIGNED" ]; then
            echo "Signed universal release APK: $SIGNED"

            # Cryptographically verify the APK signature before shipping it.
            # `set -e` above aborts the job immediately if verification fails.
            APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
            "$APKSIGNER" verify --print-certs "$SIGNED"
            echo "APK signature verified with $APKSIGNER"

            cp "$SIGNED" "release-assets/qenc-${VERSION}-android-7-to-16-universal.apk"
          elif [ -n "${QENC_KEYSTORE_PATH:-}" ]; then
            echo "::error::Release keystore was configured, but no signed universal-release APK was produced."
            exit 1
          else
            echo "::warning::No signed APK found and QENC_KEYSTORE_PATH is empty — packaging an unsigned APK (manual test run)."
            UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" | sort | head -n1 || true)
            cp "$UNSIGNED" "release-assets/qenc-${VERSION}-android-7-to-16-universal-unsigned.apk"
          fi
          ls -lh release-assets

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-assets
          path: release-assets/*

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## QENC ${{ github.ref_name }} — Post-Quantum Encrypted Container

            100% offline, zero-telemetry, pure-Rust encrypted archiver (Tauri 2.0).
            Hybrid **X25519 + NIST FIPS 203 ML-KEM-1024** key exchange, **XChaCha20-Poly1305** AEAD, **Argon2id** KDF, **Zstd** streaming compression.

            | Asset | Platform |
            |---|---|
            | `qenc-*-linux-amd64.deb` + `qenc-cli-*-linux-amd64.tar.gz` | Debian / Kali / Ubuntu |
            | `qenc-*-windows-x64-setup.exe` + `qenc-cli-*-windows-x64.zip` | Windows 10 / 11 |
            | `qenc-*-android-7-to-16-universal.apk` | Android 7 — 16 (arm64 + armv7) |
            | `SHA256SUMS.txt` | Verify all binaries |

            > **Security notice:** implements NIST FIPS 203 primitives via pure-Rust crates; has **not** undergone a formal independent third-party cryptographic audit.