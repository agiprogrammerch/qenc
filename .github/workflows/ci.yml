name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/qenc-core
            crates/qenc-cli
            src-tauri

      - name: Syntax-check Android patch script
        run: node --check scripts/patch-android-project.mjs

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck + build frontend
        run: |
          npx tsc --noEmit
          npm run build

      - name: Cargo tests
        run: cargo test --workspace

      - name: Cargo clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings